<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>royal300 Monthly Reports</title>
<style>
  :root {
    --navy: #101b33;
    --accent: #0078d4;
    --accent-dark: #005ea3;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1a202c;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.07);
    padding: 36px;
    width: 100%;
    max-width: 460px;
    border: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--navy), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.5px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    color: var(--navy);
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.4;
  }
  .field-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
  }
  .refresh-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  select, input[type="month"] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,120,212,0.12);
  }
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .features-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 20px 0 24px;
  }
  .pill {
    background: #f1f5f9;
    color: #475569;
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    font-weight: 500;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: var(--error); font-weight: 500; }
  .status.success { color: var(--success); font-weight: 500; }
  .spinner {
    display: inline-block;
    width: 15px;
    height: 15px;
    border: 2px solid #e2e8f0;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">R3</div>
      <h1>royal300 Monthly Reports</h1>
    </div>
    <p class="subtitle">Generate executive 2-page Meta performance reports with Month-over-Month comparisons and content breakdown.</p>

    <div class="features-pills">
      <span class="pill">Follower MoM</span>
      <span class="pill">Views &amp; Reach</span>
      <span class="pill">Reels vs Video vs Graphics</span>
      <span class="pill">Top 5 Content</span>
      <span class="pill">Executive 2-Page PDF</span>
    </div>

    <form id="reportForm">
      <div class="field-header">
        <label for="pageSelect">Client Facebook Page</label>
        <button type="button" class="refresh-btn" id="refreshBtn">Refresh Pages</button>
      </div>
      <select id="pageSelect" name="page_id" required>
        {% for p in pages %}
        <option value="{{ p.page_id }}" data-fans="{{ p.fans }}">{{ p.label }}{% if p.fans %} ({{ "{:,}".format(p.fans) }} fans){% endif %}</option>
        {% endfor %}
      </select>

      <label for="monthInput">Report Month</label>
      <input type="month" id="monthInput" name="month" value="{{ default_month }}" required>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="btnText">Generate &amp; Download 2-Page PDF</span>
      </button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('reportForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const status = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const pageSelect = document.getElementById('pageSelect');

    refreshBtn.addEventListener('click', async () => {
      refreshBtn.textContent = 'Syncing...';
      try {
        const res = await fetch('/api/pages');
        const data = await res.json();
        if (data.pages && data.pages.length) {
          pageSelect.innerHTML = '';
          data.pages.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.page_id;
            opt.textContent = p.label + (p.fans ? ` (${Number(p.fans).toLocaleString()} fans)` : '');
            pageSelect.appendChild(opt);
          });
          status.className = 'status success';
          status.textContent = `Synced ${data.pages.length} pages from Meta Business!`;
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Could not refresh pages: ' + e.message;
      } finally {
        refreshBtn.textContent = 'Refresh Pages';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'status';
      status.textContent = '';
      btnText.innerHTML = '<span class="spinner"></span> Analyzing 30-day Facebook record...';
      btn.disabled = true;

      const formData = new FormData(form);
      try {
        const res = await fetch('/generate', { method: 'POST', body: formData });
        if (!res.ok) {
          let message = 'Failed to generate report.';
          try {
            const err = await res.json();
            message = err.error || message;
          } catch (_) {}
          throw new Error(message);
        }
        const blob = await res.blob();
        const disposition = res.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : 'report.pdf';

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        status.className = 'status success';
        status.textContent = 'Report downloaded: ' + filename;
      } catch (err) {
        status.className = 'status error';
        status.textContent = err.message;
      } finally {
        btnText.textContent = 'Generate & Download 2-Page PDF';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
